  <path d="M0 610h1600v290H0z" fill="url(#horizon)"/>
  <g fill="#2ce4d7" opacity=".25">
    <path d="M112 558h12v3h-12zm0 14h12v3h-12zm143-34h5v28h-5zm58-31h8v4h-8zm0 18h8v4h-8zm118-28h12v4h-12zm0 20h12v4h-12zm132 10h9v4h-9zm20 22h9v4h-9zm212-93h10v4h-10zm0 20h10v4h-10zm0 20h10v4h-10zm146 14h8v4h-8zm120-70h10v4h-10zm0 22h10v4h-10zm0 22h10v4h-10zm154 41h8v4h-8z"/>
