<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hardik OS night-grid wallpaper concept</title>
  <desc id="desc">Dark navy night sky over a distant geometric city grid, with a cyan-lit horizon and subtle teal circuit lines.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07111a"/><stop offset=".58" stop-color="#101e2b"/><stop offset="1" stop-color="#07151d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#00e1d0" stop-opacity=".23"/><stop offset="1" stop-color="#00e1d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="horizon" x2="0" y2="1"><stop stop-color="#25e6dc" stop-opacity=".32"/><stop offset=".12" stop-color="#105968" stop-opacity=".2"/><stop offset="1" stop-color="#07111a" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#57e7e0" stroke-opacity=".055" stroke-width="1"/></pattern>
    <linearGradient id="building" x2="0" y2="1"><stop stop-color="#1a3440"/><stop offset="1" stop-color="#08121a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
